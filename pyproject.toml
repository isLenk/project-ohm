# uv workspace for the Python apps that share the main venv (.venv at the repo root).
#   uv sync --all-packages      create/update .venv with every app's dependencies
#
# apps/tts has its own Python 3.11 venv (deepspeed wheel) and apps/memory runs in Docker
# on the NAS, so neither is a member.

[tool.uv.workspace]
members = ["apps/engine", "apps/curator"]

[tool.uv]
# Everything runs on the Windows PC with the GPU
environments = ["sys_platform == 'win32'"]

# faster-whisper and openwakeword ask for the CPU onnxruntime, which shadows onnxruntime-gpu
# (the engine's Parakeet STT needs the GPU one). Never install it.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

# Versions from the venv this was set up from, so a fresh `uv sync` gets the same working set.
# Loosen or drop a line to let uv pick something newer.
