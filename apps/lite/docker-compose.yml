services:
  lite:
    build:
      context: .
      additional_contexts:
        # apps/brain locally, deploy.sh's copy on the NAS
        brain: ../brain
    container_name: ohm-lite
    restart: unless-stopped
    env_file: .env
    environment:
      # Memory service: brain logs and names to mask
      MEMORY_API_URL: http://host.docker.internal:8100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Codex sign-in, receipts, API spend
      - ./data:/data
